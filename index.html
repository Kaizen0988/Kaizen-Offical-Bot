<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TopUp Myanmar Bot - Mini App</title>
    <!-- Telegram Web App Script -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --primary-color: #2481cc;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
        }
        h2 {
            text-align: center;
            color: var(--accent-color);
            margin-bottom: 20px;
        }
        .search-box {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #334155;
            background-color: var(--card-bg);
            color: white;
            font-size: 16px;
            margin-bottom: 20px;
            box-sizing: border-box;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }
        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            border: 1px solid #334155;
        }
        .card:hover {
            border-color: var(--accent-color);
            transform: translateY(-3px);
        }
        .card img {
            width: 60px;
            height: 60px;
            border-radius: 10px;
            object-fit: cover;
            margin-bottom: 10px;
        }
        .card h3 {
            font-size: 15px;
            margin: 5px 0;
        }
        .card p {
            font-size: 12px;
            color: #94a3b8;
            margin: 0;
        }
    </style>
</head>
<body>

    <h2>TopUp Myanmar - ဈေးဝယ်ရန်</h2>
    
    <!-- ရှာဖွေရန် Box -->
    <input type="text" class="search-box" placeholder="ဂိမ်း သို့မဟုတ် ကတ်အမျိုးအစား ရှာရန်..." onkeyup="searchGame()">

    <!-- ဂိမ်းနှင့် ကတ်များ စာရင်း -->
    <div class="grid-container" id="productGrid">
        
        <div class="card" onclick="selectItem('Mobile Legends Diamonds')">
            <img src="https://cdn-icons-png.flaticon.com/512/1164/1164620.png" alt="MLBB">
            <h3>Mobile Legends</h3>
            <p>Diamonds</p>
        </div>

        <div class="card" onclick="selectItem('PUBG Mobile UC')">
            <img src="https://cdn-icons-png.flaticon.com/512/1164/1164620.png" alt="PUBG">
            <h3>PUBG Mobile</h3>
            <p>UC Top Up</p>
        </div>

        <div class="card" onclick="selectItem('Free Fire Diamonds')">
            <img src="https://cdn-icons-png.flaticon.com/512/1164/1164620.png" alt="Free Fire">
            <h3>Free Fire</h3>
            <p>Diamonds</p>
        </div>

        <div class="card" onclick="selectItem('Clash of Clans Gems')">
            <img src="https://cdn-icons-png.flaticon.com/512/1164/1164620.png" alt="COC">
            <h3>Clash of Clans</h3>
            <p>Gems</p>
        </div>

        <div class="card" onclick="selectItem('Steam Wallet Codes')">
            <img src="https://cdn-icons-png.flaticon.com/512/349/349221.png" alt="Steam">
            <h3>Steam Wallet</h3>
            <p>Codes</p>
        </div>

        <div class="card" onclick="selectItem('Visa & Master Cards')">
            <img src="https://cdn-icons-png.flaticon.com/512/6963/6963703.png" alt="Cards">
            <h3>Visa / Master</h3>
            <p>Virtual Cards</p>
        </div>

    </div>

    <script>
        // Telegram Web App Initialization
        let tg = window.Telegram.WebApp;
        tg.expand();

        function selectItem(itemName) {
            // အသုံးပြုသူက နှိပ်လိုက်တဲ့ ပစ္စည်းအချက်အလက်ကို Telegram Bot ဆီ ပို့ပေးခြင်း
            tg.sendData(JSON.stringify({ product: itemName, action: "buy" }));
            
            // ခေတ္တ အသိပေးချက်ပြရန်
            alert(itemName + " ကို ရွေးချယ်လိုက်ပါပြီ။ Bot သို့ ပို့နေပါသည်...");
        }

        // ရှာဖွေသည့် ဖန်ရှင်
        function searchGame() {
            let input = document.querySelector('.search-box').value.toLowerCase();
            let cards = document.querySelectorAll('.card');

            cards.forEach(card => {
                let title = card.querySelector('h3').innerText.toLowerCase();
                if (title.includes(input)) {
                    card.style.display = "block";
                } else {
                    card.style.display = "none";
                }
            });
        }
    </script>
</body>
</html>
